# Pipeline bảo mật chuỗi cung ứng (kế hoạch mục 9): verify + policy-test (không quyền AWS) → publish (OIDC, chỉ main).
# Không có job deploy: đồ án chạy kind, triển khai bằng scripts/deploy.sh từ release.json (mục 9.4 ghi chú, 10.4).
# Action ghim theo commit SHA đầy đủ; công cụ CLI ghim phiên bản + SHA-256 (nguồn: docs/versions.md).
name: secure-supply-chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LOCAL_IMAGE: podinfo:ci
  GO_VERSION: "1.27.4"              # khớp builder trong Dockerfile
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb   # gitleaks_8.30.1_linux_x64.tar.gz
  SYFT_VERSION: "1.56.0"
  SYFT_SHA256: 1c2493cfcf52d3367d6cb25780d9190c111c2219c34c820574c43e8bae15c528       # syft_1.56.0_linux_amd64.tar.gz
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf      # trivy_0.76.2_Linux-64bit.tar.gz
  KYVERNO_CLI_VERSION: v1.19.2      # phải trùng bản Kyverno trên cụm
  KYVERNO_CLI_SHA256: 357eaf1df8bc24ddd5a73979fadeaae6a032e8710f11af264229756e4956bf4a # kyverno-cli_v1.19.2_linux_x86_64.tar.gz

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write         # upload SARIF lên Code Scanning; KHÔNG có id-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0             # Gitleaks quét toàn lịch sử
          persist-credentials: false

      - name: Install pinned CLI tools (version + SHA-256)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          fetch() {  # fetch <url> <sha256> <file>
            curl -fsSL --retry 3 -o "$3" "$1"
            echo "$2  $3" | sha256sum -c -
          }
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$GITLEAKS_SHA256" gitleaks.tgz
          fetch "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" "$SYFT_SHA256" syft.tgz
          fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" "$TRIVY_SHA256" trivy.tgz
          tar -xzf gitleaks.tgz gitleaks && tar -xzf syft.tgz syft && tar -xzf trivy.tgz trivy
          sudo install -m 0755 gitleaks syft trivy /usr/local/bin/
          gitleaks version; syft version | grep -E '^Version'; trivy --version | sed -n 1p

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/go.sum

      - name: Unit test
        id: test
        env:
          GOTOOLCHAIN: local
        run: go -C app test -count=1 ./...

      - name: Secret scan (Gitleaks, toàn lịch sử)
        id: gitleaks
        # --log-opts=HEAD: quét TOÀN BỘ lịch sử đi tới được từ commit đang kiểm tra (với PR là merge ref).
        # Không quét mọi ref: checkout fetch-depth 0 tải cả nhánh khác, mặc định gitleaks sẽ bắt secret của
        # nhánh không liên quan và làm fail mọi PR (đã gặp 18/11/2026: run TC03 fail vì commit của nhánh TC02).
        run: |
          mkdir -p reports
          gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts=HEAD \
            --report-format json --report-path reports/gitleaks.json

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build once
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: ${{ env.LOCAL_IMAGE }}

      - name: Save image artifact
        run: |
          set -euo pipefail
          docker save "$LOCAL_IMAGE" -o image.tar
          sha256sum image.tar > image.tar.sha256
          docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}' > image.id
          cat image.tar.sha256 image.id

      - name: SBOM (Syft CLI, CycloneDX)
        run: syft -q docker-archive:image.tar -o cyclonedx-json=reports/sbom.cdx.json

      - name: Validate SBOM
        id: sbom
        # CycloneDX hợp lệ, có component, và có dependency Go của ứng dụng
        run: |
          jq -e '.bomFormat == "CycloneDX"
                 and ((.components | length) > 0)
                 and any(.components[]; (.purl // "") | startswith("pkg:golang/"))' reports/sbom.cdx.json

      - name: Vulnerability scan (một lần, JSON; lỗi công cụ/DB = fail)
        id: trivy
        run: |
          set -euo pipefail
          trivy image --input image.tar --scanners vuln \
            --format json --output reports/trivy.json --exit-code 0
          trivy convert --format sarif --output reports/trivy.sarif reports/trivy.json
          trivy convert --format table --output reports/trivy.txt reports/trivy.json
          trivy version -f json > reports/trivy-version.json

      - name: Upload SARIF (Code Scanning)
        # PR từ fork chỉ có token đọc → bỏ qua; báo cáo vẫn nằm trong artifact
        if: >-
          always() && hashFiles('reports/trivy.sarif') != '' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: reports/trivy.sarif
          category: trivy-image

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: security-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn

      - name: GATE – no CRITICAL
        id: gate
        run: |
          CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' reports/trivy.json)
          echo "Critical vulnerabilities: $CRIT"
          test "$CRIT" -eq 0

      - name: Job summary (chỉ trình bày, không đổi kết quả gate)
        if: always()
        env:
          R_TEST: ${{ steps.test.outcome }}
          R_LEAKS: ${{ steps.gitleaks.outcome }}
          R_BUILD: ${{ steps.build.outcome }}
          R_SBOM: ${{ steps.sbom.outcome }}
          R_SCAN: ${{ steps.trivy.outcome }}
          R_GATE: ${{ steps.gate.outcome }}
        run: |
          comps="chưa chạy"; crit="chưa chạy"; high="chưa chạy"; leaks="chưa chạy"; db="?"
          [ -s reports/sbom.cdx.json ] && comps=$(jq '.components | length' reports/sbom.cdx.json)
          [ -s reports/gitleaks.json ] && leaks=$(jq 'length' reports/gitleaks.json)
          if [ -s reports/trivy.json ]; then
            crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' reports/trivy.json)
            high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' reports/trivy.json)
          fi
          [ -s reports/trivy-version.json ] && db=$(jq -r '.VulnerabilityDB.UpdatedAt' reports/trivy-version.json)
          {
            echo "### Supply-chain checks – \`${GITHUB_SHA::12}\` (run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT})"
            echo "| Kiểm tra | Kết quả |"
            echo "|---|---|"
            echo "| Unit test | ${R_TEST:-skipped} |"
            echo "| Gitleaks | ${R_LEAKS:-skipped} (findings: $leaks) |"
            echo "| Build | ${R_BUILD:-skipped} |"
            echo "| SBOM | ${R_SBOM:-skipped} (components: $comps) |"
            echo "| Trivy scan | ${R_SCAN:-skipped} (DB: $db) |"
            echo "| Gate CRITICAL | ${R_GATE:-skipped} (Critical: $crit, High: $high) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verification metadata
        run: |
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
                --arg image_id "$(cat image.id)" --arg tar_sha "$(cut -d' ' -f1 image.tar.sha256)" \
                --arg sbom_sha "$(sha256sum reports/sbom.cdx.json | cut -d' ' -f1)" \
                --arg vuln_sha "$(sha256sum reports/trivy.json | cut -d' ' -f1)" \
                --arg trivy "$(trivy --version | sed -n 1p)" \
                --arg db "$(jq -r '.VulnerabilityDB.UpdatedAt' reports/trivy-version.json)" \
                '{commit_sha:$commit, workflow_run_id:$run, run_attempt:$attempt, local_image_id:$image_id,
                  image_tar_sha256:$tar_sha, sbom_sha256:$sbom_sha, vulnerability_report_sha256:$vuln_sha,
                  scanner_version:$trivy, vulnerability_db_updated_at:$db, critical_count:0, gate_result:"pass"}' \
            > verification.json
          cat verification.json

      - name: Upload approved image (chỉ push vào main, mọi gate đạt)
        # PR không bao giờ publish → không lưu image tar của PR chưa duyệt.
        # `if` không chứa hàm trạng thái nên ngầm có success(): gate fail thì bước này bị bỏ qua.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: approved-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image.tar
            image.tar.sha256
            verification.json
          retention-days: 2
          if-no-files-found: error

  policy-test:                       # required check; không có quyền AWS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Không đọc vars.ECR_IMAGE: scripts/policy-test.sh dùng giá trị giả cố định (mục 11.4)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Kyverno CLI (pinned version + SHA-256)
        run: |
          set -euo pipefail
          f="kyverno-cli_${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -O "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_CLI_VERSION}/$f"
          echo "${KYVERNO_CLI_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" kyverno
          sudo install -m 0755 kyverno /usr/local/bin/kyverno
      - name: Render policy + resource & run offline tests
        run: bash scripts/policy-test.sh   # đúng lệnh chạy ở máy local

  publish:                           # mục 9.4: chỉ push vào main, sau khi verify (mọi gate) đạt
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write                # chỉ job này có OIDC → role devsecops-publisher (trust: ref:refs/heads/main)
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      SIGNING_PROFILE_NAME: ${{ vars.SIGNING_PROFILE_NAME }}
      PUBLISH_ROLE_NAME: ${{ vars.AWS_PUBLISH_ROLE_NAME }}
      # Account ID không phải credential, nhưng repo public: để ở Secret để GitHub tự che mọi chuỗi chứa nó
      # trong log (ARN, registry). Không có Secret nào chứa access key.
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve configuration
        run: |
          set -euo pipefail
          for v in AWS_REGION ECR_REPOSITORY SIGNING_PROFILE_NAME PUBLISH_ROLE_NAME AWS_ACCOUNT_ID; do
            [ -n "${!v}" ] || { echo "::error::Thiếu cấu hình $v (repo variables/secrets)"; exit 1; }
          done
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::AWS_ACCOUNT_ID sai định dạng"; exit 1; }
          reg="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          {
            echo "ECR_REGISTRY=$reg"
            echo "ECR_IMAGE=$reg/$ECR_REPOSITORY"
            echo "SIGNING_PROFILE_ARN=arn:aws:signer:${AWS_REGION}:${AWS_ACCOUNT_ID}:/signing-profiles/${SIGNING_PROFILE_NAME}"
            echo "PUBLISH_ROLE_ARN=arn:aws:iam::${AWS_ACCOUNT_ID}:role/${PUBLISH_ROLE_NAME}"
          } >> "$GITHUB_ENV"

      - name: Download approved image (cùng workflow run)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: approved-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact             # digest-mismatch mặc định = error

      - name: Verify artifact integrity & load (không build lại)
        working-directory: artifact
        run: |
          set -euo pipefail
          sha256sum -c image.tar.sha256
          test "$(cut -d' ' -f1 image.tar.sha256)" = "$(jq -r .image_tar_sha256 verification.json)"
          # verification.json phải thuộc đúng commit/run/attempt này và gate đã đạt
          jq -e --arg c "$GITHUB_SHA" --arg r "$GITHUB_RUN_ID" --arg a "$GITHUB_RUN_ATTEMPT" \
            '.commit_sha == $c and .workflow_run_id == $r and .run_attempt == $a
             and .gate_result == "pass" and .critical_count == 0' verification.json
          docker load -i image.tar
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')" = "$(jq -r .local_image_id verification.json)"
          echo "Image đã scan: $(jq -r .local_image_id verification.json)"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ env.PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-publish-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Push (đúng image đã scan, tag duy nhất mỗi lần chạy)
        id: push
        run: |
          set -euo pipefail
          aws --version
          aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          TAG="sha-${GITHUB_SHA::12}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "$LOCAL_IMAGE" "$ECR_IMAGE:$TAG"
          docker push "$ECR_IMAGE:$TAG"
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Digest không hợp lệ: $DIGEST"; exit 1; }
          # Digest registry trả về phải trùng digest mà docker push ghi nhận
          PUSHED=$(docker image inspect "$ECR_IMAGE:$TAG" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep -F "$ECR_IMAGE@" | cut -d@ -f2 | head -1)
          [ "$PUSHED" = "$DIGEST" ] || { echo "::error::Digest lệch: push=$PUSHED registry=$DIGEST"; exit 1; }
          docker logout "$ECR_REGISTRY"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Wait for ECR Managed Signing (đúng profile, COMPLETE)
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          RELEASE_DIR: release-raw
        run: bash scripts/wait-signature.sh

      - name: Release manifest
        env:
          TAG: ${{ steps.push.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          jq --arg uri "$ECR_IMAGE" --arg tag "$TAG" --arg digest "$DIGEST" --arg arn "$SIGNING_PROFILE_ARN" \
             --arg at "$(date -u +%FT%TZ)" \
             '. + {image_uri:$uri, image_tag:$tag, image_digest:$digest,
                   signing_profile_arn:$arn, signing_status:"COMPLETE", published_at:$at}' \
             artifact/verification.json > release-raw/release.json
          {
            echo "### Release – \`${GITHUB_SHA::12}\` (run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT})"
            echo "| Trường | Giá trị |"
            echo "|---|---|"
            echo "| Image | \`$ECR_IMAGE@$DIGEST\` |"
            echo "| Tag | \`$TAG\` |"
            echo "| Signing | \`COMPLETE\` – \`$SIGNING_PROFILE_ARN\` |"
          } | sed "s/${AWS_ACCOUNT_ID}/<ACCOUNT_ID>/g" >> "$GITHUB_STEP_SUMMARY"

      - name: Mask account ID in release files (artifact của repo public)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p release
          [ -n "$AWS_ACCOUNT_ID" ] || exit 0
          for f in release-raw/*.json; do
            [ -e "$f" ] || continue
            sed "s/${AWS_ACCOUNT_ID}/<ACCOUNT_ID>/g" "$f" > "release/$(basename "$f")"
          done
          if grep -rqF "$AWS_ACCOUNT_ID" release/; then echo "::error::Còn account ID trong release/"; exit 1; fi

      - name: Upload release record
        if: always()                 # lưu cả signing-status.json khi ký FAILED/hết giờ; release.json chỉ có khi đạt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          retention-days: 30
          if-no-files-found: warn
