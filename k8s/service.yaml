# ClusterIP + kubectl port-forward khi demo (tránh chi phí LoadBalancer). Kế hoạch mục 10.3.
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: app
  labels: { app: podinfo }
spec:
  type: ClusterIP
  selector: { app: podinfo }
  ports:
    - name: http
      port: 9898
      targetPort: http
