# Cùng repo, có chữ ký nhưng của profile B (không tin cậy) → Policy 2 phải TỪ CHỐI
# Render: envsubst '${ECR_IMAGE} ${D_WRONGSIGNER}' (giá trị trong reports/spike/fixtures.env).
apiVersion: v1
kind: Pod
metadata:
  name: tc06-wrong-signer
  namespace: demo
  labels: { tc: tc06 }
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
  containers:
    - name: app
      image: ${ECR_IMAGE}@${D_WRONGSIGNER}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      volumeMounts:
        - { name: tmp, mountPath: /tmp }
        - { name: data, mountPath: /data }
  volumes:
    - { name: tmp, emptyDir: {} }
    - { name: data, emptyDir: {} }
