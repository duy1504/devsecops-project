# TC08 — container chính hợp lệ (đúng repo + digest), init container từ Docker Hub → Pod phải bị từ chối.
# Render: envsubst '<ACCOUNT_ID>.dkr.ecr.ap-southeast-1.amazonaws.com/podinfo sha256:59c79d672187539c33b7da543c70360fd55a0963eaa780da44e3cad3db6d0035'. APP_DIGEST = sha256:<64 hex> của image hợp lệ.
apiVersion: v1
kind: Pod
metadata:
  name: tc08-bad-init
  namespace: demo
  labels: { tc: tc08 }
spec:
  initContainers:
    - name: init
      image: docker.io/library/busybox@sha256:881e40db6132f2dfd58f59a344e6a115da5caa15a7aa192b4ba7f706a058634e
      command: ["true"]
  containers:
    - name: app
      image: <ACCOUNT_ID>.dkr.ecr.ap-southeast-1.amazonaws.com/podinfo@sha256:59c79d672187539c33b7da543c70360fd55a0963eaa780da44e3cad3db6d0035
