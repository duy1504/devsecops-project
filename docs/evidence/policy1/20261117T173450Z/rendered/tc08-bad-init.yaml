apiVersion: v1
kind: Pod
metadata:
  name: tc08-bad-init
  namespace: demo
  labels: { tc: tc08 }
spec:
  initContainers:
    - name: init
      image: docker.io/library/busybox@sha256:881e40db6132f2dfd58f59a344e6a115da5caa15a7aa192b4ba7f706a058634e
      command: ["true"]
  containers:
    - name: app
      image: 111122223333.dkr.ecr.ap-southeast-1.amazonaws.com/podinfo@sha256:d1b703d2d522e6013cb60627898788aac45f39d1acb33eabdb525770da92ceda
