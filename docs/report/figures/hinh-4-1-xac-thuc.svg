<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 470" width="1350" height="470" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/></marker>
  </defs>
  <rect width="1350" height="470" fill="#ffffff"/>

  <!-- tiêu đề cột -->
  <g font-weight="700" font-size="13" fill="#52606d">
    <text x="145" y="30" text-anchor="middle">Thành phần</text>
    <text x="460" y="30" text-anchor="middle">Credential lấy bằng cách nào</text>
    <text x="815" y="30" text-anchor="middle">Role / phiên</text>
    <text x="1170" y="30" text-anchor="middle">Được làm gì trên AWS</text>
  </g>
  <line x1="20" y1="42" x2="1330" y2="42" stroke="#cbd2d9"/>

  <!-- Làn 1: GitHub Actions -> publisher -->
  <rect x="10" y="52" width="1330" height="112" rx="10" fill="#f5f8ff" stroke="#dbe5fb"/>
  <rect x="20" y="62" width="250" height="92" rx="8" fill="#e8f0fe" stroke="#2f6fd6" stroke-width="1.5"/>
  <text x="145" y="88" text-anchor="middle" font-weight="700" fill="#1e3a8a">GitHub Actions</text>
  <text x="145" y="108" text-anchor="middle" font-size="12">job publish (chỉ push main)</text>
  <text x="145" y="126" text-anchor="middle" font-size="11">permissions: id-token: write</text>
  <text x="145" y="142" text-anchor="middle" font-size="11">(job verify không có quyền này)</text>
  <rect x="300" y="62" width="320" height="92" rx="8" fill="#ffffff" stroke="#2f6fd6"/>
  <text x="460" y="86" text-anchor="middle" font-weight="600">Token OIDC do GitHub ký (JWT)</text>
  <text x="460" y="106" text-anchor="middle" font-size="11">aud = sts.amazonaws.com</text>
  <text x="460" y="122" text-anchor="middle" font-size="11">sub = repo:…@&lt;owner_id&gt;/…@&lt;repo_id&gt;</text>
  <text x="460" y="138" text-anchor="middle" font-size="11">:ref:refs/heads/main</text>
  <rect x="650" y="62" width="330" height="92" rx="8" fill="#ffffff" stroke="#2f6fd6"/>
  <text x="815" y="86" text-anchor="middle" font-weight="600">devsecops-publisher</text>
  <text x="815" y="106" text-anchor="middle" font-size="11">sts:AssumeRoleWithWebIdentity</text>
  <text x="815" y="122" text-anchor="middle" font-size="11">trust chỉ khớp đúng aud + sub</text>
  <text x="815" y="138" text-anchor="middle" font-size="11">phiên 900 s</text>
  <rect x="1010" y="62" width="320" height="92" rx="8" fill="#fff7ed" stroke="#e08a2e"/>
  <text x="1170" y="86" text-anchor="middle" font-weight="600">Push vào ECR podinfo</text>
  <text x="1170" y="106" text-anchor="middle" font-size="11">signer:SignPayload (profile chính)</text>
  <text x="1170" y="122" text-anchor="middle" font-size="11">→ Managed Signing ký khi push</text>
  <text x="1170" y="138" text-anchor="middle" font-size="11" fill="#b71c1c">không: IAM, signing rule, xóa image</text>

  <!-- Làn 2: Extension -> verifier -->
  <rect x="10" y="176" width="1330" height="112" rx="10" fill="#f3fbf6" stroke="#d3eedc"/>
  <rect x="20" y="186" width="250" height="92" rx="8" fill="#effaf3" stroke="#2e9d57" stroke-width="1.5"/>
  <text x="145" y="212" text-anchor="middle" font-weight="700" fill="#1b5e20">Extension xác minh</text>
  <text x="145" y="232" text-anchor="middle" font-size="12">kyverno-notation-aws (Pod)</text>
  <text x="145" y="250" text-anchor="middle" font-size="11">được Kyverno gọi khi tạo Pod</text>
  <text x="145" y="266" text-anchor="middle" font-size="11">(Policy 2)</text>
  <rect x="300" y="186" width="320" height="92" rx="8" fill="#ffffff" stroke="#2e9d57"/>
  <text x="460" y="210" text-anchor="middle" font-weight="600">Secret verifier-aws-credentials</text>
  <text x="460" y="230" text-anchor="middle" font-size="11">nạp bởi refresh-lab-credentials.sh</text>
  <text x="460" y="246" text-anchor="middle" font-size="11">(file tạm quyền 600, ngoài Git)</text>
  <text x="460" y="262" text-anchor="middle" font-size="11">trên EKS: IRSA / Pod Identity</text>
  <rect x="650" y="186" width="330" height="92" rx="8" fill="#ffffff" stroke="#2e9d57"/>
  <text x="815" y="210" text-anchor="middle" font-weight="600">devsecops-verifier</text>
  <text x="815" y="230" text-anchor="middle" font-size="11">sts:AssumeRole từ phiên SSO quản trị</text>
  <text x="815" y="246" text-anchor="middle" font-size="11">phiên ≤ 1 giờ (role chaining)</text>
  <text x="815" y="262" text-anchor="middle" font-size="11">hết hạn → mọi Pod mới bị chặn</text>
  <rect x="1010" y="186" width="320" height="92" rx="8" fill="#fff7ed" stroke="#e08a2e"/>
  <text x="1170" y="210" text-anchor="middle" font-weight="600">Đọc ECR podinfo (chữ ký)</text>
  <text x="1170" y="230" text-anchor="middle" font-size="11">signer:GetRevocationStatus</text>
  <text x="1170" y="246" text-anchor="middle" font-size="11">kiểm thu hồi</text>
  <text x="1170" y="262" text-anchor="middle" font-size="11" fill="#b71c1c">không: push, ký (PutImage → AccessDenied)</text>

  <!-- Làn 3: kubelet -> ecr-pull -->
  <rect x="10" y="300" width="1330" height="112" rx="10" fill="#f2f9fa" stroke="#d2ecef"/>
  <rect x="20" y="310" width="250" height="92" rx="8" fill="#e6f6f8" stroke="#1f8a99" stroke-width="1.5"/>
  <text x="145" y="336" text-anchor="middle" font-weight="700" fill="#0f5964">kubelet (node kind)</text>
  <text x="145" y="356" text-anchor="middle" font-size="12">kéo image sau khi</text>
  <text x="145" y="374" text-anchor="middle" font-size="12">admission đã chấp nhận</text>
  <rect x="300" y="310" width="320" height="92" rx="8" fill="#ffffff" stroke="#1f8a99"/>
  <text x="460" y="334" text-anchor="middle" font-weight="600">imagePullSecret ecr-pull</text>
  <text x="460" y="354" text-anchor="middle" font-size="11">gắn ServiceAccount default</text>
  <text x="460" y="370" text-anchor="middle" font-size="11">của namespace app, demo</text>
  <text x="460" y="386" text-anchor="middle" font-size="11">trên EKS: IAM role của node</text>
  <rect x="650" y="310" width="330" height="92" rx="8" fill="#ffffff" stroke="#1f8a99"/>
  <text x="815" y="334" text-anchor="middle" font-weight="600">Token ECR (≤ 12 giờ)</text>
  <text x="815" y="354" text-anchor="middle" font-size="11">lấy bằng chính role verifier</text>
  <text x="815" y="370" text-anchor="middle" font-size="11">→ chỉ đọc</text>
  <rect x="1010" y="310" width="320" height="92" rx="8" fill="#fff7ed" stroke="#e08a2e"/>
  <text x="1170" y="334" text-anchor="middle" font-weight="600">Kéo layer từ ECR podinfo</text>
  <text x="1170" y="354" text-anchor="middle" font-size="11">không cấp quyền gì cho plugin</text>
  <text x="1170" y="370" text-anchor="middle" font-size="11">AWS Signer (và ngược lại)</text>

  <!-- mũi tên trong các làn -->
  <g stroke="#3e4c59" stroke-width="1.5" marker-end="url(#a)">
    <line x1="270" y1="108" x2="298" y2="108"/><line x1="620" y1="108" x2="648" y2="108"/><line x1="980" y1="108" x2="1008" y2="108"/>
    <line x1="270" y1="232" x2="298" y2="232"/><line x1="620" y1="232" x2="648" y2="232"/><line x1="980" y1="232" x2="1008" y2="232"/>
    <line x1="270" y1="356" x2="298" y2="356"/><line x1="620" y1="356" x2="648" y2="356"/><line x1="980" y1="356" x2="1008" y2="356"/>
  </g>

  <!-- ghi chú -->
  <text x="20" y="440" font-size="12"><tspan font-weight="700">Quản trị lab:</tspan> phiên SSO AdministratorAccess (8 giờ), chỉ trên máy lab — dựng hạ tầng, assume role verifier; không dùng trong CI. Không có access key dài hạn ở bất kỳ đâu.</text>
  <text x="20" y="460" font-size="12"><tspan font-weight="700">Deployer (Kubernetes):</tspan> Role app-deployer trong namespace app — không truy cập AWS, không đọc Secret, không exec; triển khai bằng deploy.sh.</text>
</svg>
