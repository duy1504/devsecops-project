<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 600" width="1420" height="600" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="1420" height="600" fill="#ffffff"/>

  <!-- Developer + GitHub -->
  <rect x="20" y="110" width="150" height="46" rx="8" fill="#f0f4f8" stroke="#52606d"/>
  <text x="95" y="138" text-anchor="middle" font-weight="600">Developer</text>
  <line x1="95" y1="156" x2="95" y2="198" stroke="#3e4c59" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="102" y="182" font-size="11">PR / push</text>
  <rect x="20" y="200" width="150" height="96" rx="8" fill="#f0f4f8" stroke="#52606d"/>
  <text x="95" y="224" text-anchor="middle" font-weight="600">GitHub repo</text>
  <text x="95" y="246" text-anchor="middle" font-size="11">main: branch protection</text>
  <text x="95" y="263" text-anchor="middle" font-size="11">bắt PR + 2 check</text>
  <text x="95" y="280" text-anchor="middle" font-size="11">action ghim theo SHA</text>
  <polyline points="170,230 192,230 192,150 213,150" fill="none" stroke="#3e4c59" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="170,270 192,270 192,472 213,472" fill="none" stroke="#3e4c59" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- CI container -->
  <rect x="200" y="40" width="500" height="470" rx="12" fill="#f8fafc" stroke="#9aa5b1"/>
  <text x="215" y="62" font-weight="700" font-size="14">GitHub Actions</text>

  <!-- verify -->
  <rect x="215" y="75" width="470" height="150" rx="10" fill="#eef1f5" stroke="#7b8794" stroke-dasharray="5 3"/>
  <text x="227" y="95" font-weight="600">Job verify — không có quyền AWS (chạy cho PR và main)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="227" y="108" width="84" height="62" rx="6" fill="#ffffff" stroke="#7b8794"/>
    <text x="269" y="143">Unit test</text>
    <rect x="317" y="108" width="84" height="62" rx="6" fill="#ffffff" stroke="#7b8794"/>
    <text x="359" y="135">Gitleaks</text><text x="359" y="151">toàn lịch sử</text>
    <rect x="407" y="108" width="84" height="62" rx="6" fill="#ffffff" stroke="#7b8794"/>
    <text x="449" y="135">Build 1 lần</text><text x="449" y="151">→ image.tar</text>
    <rect x="497" y="108" width="84" height="62" rx="6" fill="#ffffff" stroke="#7b8794"/>
    <text x="539" y="135">SBOM</text><text x="539" y="151">(Syft)</text>
    <rect x="587" y="108" width="84" height="62" rx="6" fill="#ffffff" stroke="#7b8794"/>
    <text x="629" y="135">Trivy gate</text><text x="629" y="151">0 Critical</text>
  </g>
  <g stroke="#3e4c59" stroke-width="1.2" marker-end="url(#a)">
    <line x1="311" y1="139" x2="316" y2="139"/><line x1="401" y1="139" x2="406" y2="139"/>
    <line x1="491" y1="139" x2="496" y2="139"/><line x1="581" y1="139" x2="586" y2="139"/>
  </g>
  <text x="227" y="200" font-size="11">Lưu báo cáo: SBOM, Trivy, Gitleaks</text>
  <text x="227" y="215" font-size="11">verification.json (image ID, SHA-256)</text>

  <!-- fail -->
  <line x1="629" y1="170" x2="629" y2="236" stroke="#c62828" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="520" y="238" width="165" height="40" rx="6" fill="#fdecea" stroke="#c62828"/>
  <text x="602" y="255" text-anchor="middle" font-size="11" fill="#b71c1c" font-weight="600">FAIL → dừng</text>
  <text x="602" y="270" text-anchor="middle" font-size="11" fill="#b71c1c">không phát hành</text>

  <!-- verify -> publish -->
  <line x1="300" y1="225" x2="300" y2="298" stroke="#2f6fd6" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="308" y="266" font-size="11" fill="#1d4ed8" font-weight="600">PASS + push vào main</text>

  <!-- publish -->
  <rect x="215" y="300" width="470" height="130" rx="10" fill="#e8f0fe" stroke="#2f6fd6" stroke-width="1.5"/>
  <text x="227" y="320" font-weight="600" fill="#1e3a8a">Job publish — OIDC → role devsecops-publisher (chỉ main)</text>
  <g font-size="12">
    <text x="235" y="343">1. Tải đúng image.tar của cùng run · kiểm SHA-256 + image ID</text>
    <text x="235" y="363">2. Push tag sha-&lt;commit&gt;-run-&lt;id&gt;-&lt;attempt&gt; (không build lại)</text>
    <text x="235" y="383">3. Chờ ký COMPLETE đúng profile</text>
    <text x="235" y="403">4. Ghi release.json (commit, digest, SBOM, CVE, profile)</text>
  </g>

  <!-- policy-test -->
  <rect x="215" y="450" width="300" height="45" rx="8" fill="#eef1f5" stroke="#7b8794" stroke-dasharray="5 3"/>
  <text x="227" y="469" font-weight="600" font-size="12">Job policy-test</text>
  <text x="227" y="486" font-size="11">Kyverno CLI offline · không có quyền AWS</text>

  <!-- AWS container -->
  <rect x="730" y="40" width="250" height="470" rx="12" fill="#fff7ed" stroke="#e08a2e"/>
  <text x="745" y="62" font-weight="700" font-size="14">AWS (ap-southeast-1)</text>
  <rect x="750" y="85" width="210" height="125" rx="10" fill="#ffffff" stroke="#e08a2e" stroke-width="1.5"/>
  <text x="855" y="108" text-anchor="middle" font-weight="600">Amazon ECR</text>
  <text x="855" y="128" text-anchor="middle" font-size="12">repo podinfo</text>
  <text x="855" y="146" text-anchor="middle" font-size="11">tag IMMUTABLE · KMS</text>
  <text x="855" y="168" text-anchor="middle" font-size="11">image (digest)</text>
  <text x="855" y="184" text-anchor="middle" font-size="11">+ chữ ký Notation</text>
  <text x="855" y="200" text-anchor="middle" font-size="11">(OCI referrer)</text>
  <rect x="750" y="300" width="210" height="90" rx="10" fill="#ffffff" stroke="#e08a2e" stroke-width="1.5"/>
  <text x="855" y="323" text-anchor="middle" font-weight="600">AWS Signer</text>
  <text x="855" y="343" text-anchor="middle" font-size="11">podinfo_signing_profile</text>
  <text x="855" y="360" text-anchor="middle" font-size="11">Notation-OCI-SHA384-ECDSA</text>
  <text x="855" y="377" text-anchor="middle" font-size="11">kiểm tra thu hồi</text>
  <line x1="815" y1="210" x2="815" y2="298" stroke="#3e4c59" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="808" y="245" font-size="11" text-anchor="end">Managed</text>
  <text x="808" y="260" font-size="11" text-anchor="end">Signing</text>
  <line x1="895" y1="300" x2="895" y2="212" stroke="#3e4c59" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="902" y="245" font-size="11">chữ ký</text>
  <text x="902" y="260" font-size="11">Notation</text>
  <rect x="750" y="415" width="210" height="80" rx="8" fill="#ffffff" stroke="#e5a96b" stroke-dasharray="4 3"/>
  <text x="762" y="435" font-size="11" font-weight="600">IAM (quyền tối thiểu)</text>
  <text x="762" y="453" font-size="11">publisher: push + SignPayload</text>
  <text x="762" y="470" font-size="11">verifier: chỉ đọc + thu hồi</text>
  <text x="762" y="487" font-size="11">không có access key dài hạn</text>

  <!-- publish -> ECR -->
  <line x1="685" y1="340" x2="748" y2="175" stroke="#2f6fd6" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="694" y="290" font-size="11" fill="#1d4ed8" font-weight="600">push</text>

  <!-- K8s container -->
  <rect x="1010" y="40" width="370" height="470" rx="12" fill="#effaf3" stroke="#2e9d57"/>
  <text x="1025" y="62" font-weight="700" font-size="14">Kubernetes (kind)</text>
  <text x="1170" y="62" font-size="11">policy chỉ áp cho namespace app, demo</text>
  <rect x="1030" y="78" width="330" height="48" rx="8" fill="#ffffff" stroke="#2e9d57"/>
  <text x="1195" y="98" text-anchor="middle" font-size="12" font-weight="600">deploy.sh (danh tính deployer)</text>
  <text x="1195" y="116" text-anchor="middle" font-size="11">image = &lt;ECR&gt;/podinfo@sha256:&lt;digest&gt;</text>
  <line x1="1120" y1="126" x2="1120" y2="143" stroke="#3e4c59" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="1030" y="145" width="330" height="40" rx="8" fill="#ffffff" stroke="#2e9d57"/>
  <text x="1195" y="170" text-anchor="middle" font-size="12">kube-apiserver → Kyverno (fail-closed)</text>
  <line x1="1120" y1="185" x2="1120" y2="208" stroke="#3e4c59" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="1030" y="210" width="180" height="55" rx="8" fill="#ffffff" stroke="#2e9d57" stroke-width="1.5"/>
  <text x="1120" y="232" text-anchor="middle" font-weight="600">Policy 1 (CEL)</text>
  <text x="1120" y="251" text-anchor="middle" font-size="11">đúng repo + digest 64 hex</text>
  <line x1="1120" y1="265" x2="1120" y2="288" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="1127" y="282" font-size="11" fill="#2e7d32">đạt</text>
  <rect x="1030" y="290" width="180" height="55" rx="8" fill="#ffffff" stroke="#2e9d57" stroke-width="1.5"/>
  <text x="1120" y="312" text-anchor="middle" font-weight="600">Policy 2</text>
  <text x="1120" y="331" text-anchor="middle" font-size="11">chữ ký của profile tin cậy</text>
  <line x1="1120" y1="345" x2="1120" y2="398" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="1127" y="377" font-size="11" fill="#2e7d32">đạt</text>
  <rect x="1030" y="400" width="180" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="1120" y="423" text-anchor="middle" font-weight="700" fill="#1b5e20">Pod chạy</text>
  <text x="1120" y="442" text-anchor="middle" font-size="11" fill="#1b5e20">đúng digest phát hành</text>

  <rect x="1265" y="210" width="100" height="135" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="1315" y="255" text-anchor="middle" font-weight="700" fill="#b71c1c">Từ chối</text>
  <text x="1315" y="276" text-anchor="middle" font-size="10" fill="#b71c1c">stderr, exit code</text>
  <text x="1315" y="291" text-anchor="middle" font-size="10" fill="#b71c1c">event, log</text>
  <line x1="1210" y1="237" x2="1263" y2="237" stroke="#c62828" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="1236" y="229" font-size="10" text-anchor="middle" fill="#c62828">vi phạm</text>
  <line x1="1210" y1="317" x2="1263" y2="317" stroke="#c62828" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="1236" y="309" font-size="10" text-anchor="middle" fill="#c62828">lỗi</text>

  <rect x="1265" y="385" width="100" height="75" rx="8" fill="#ffffff" stroke="#2e9d57" stroke-dasharray="4 3"/>
  <text x="1315" y="407" text-anchor="middle" font-size="11" font-weight="600">Extension</text>
  <text x="1315" y="424" text-anchor="middle" font-size="10">Notation +</text>
  <text x="1315" y="439" text-anchor="middle" font-size="10">plugin AWS Signer</text>
  <line x1="1210" y1="335" x2="1275" y2="383" stroke="#3e4c59" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="1236" y="372" font-size="10" text-anchor="end">gọi</text>

  <!-- extension -> AWS (đọc chữ ký, kiểm thu hồi) -->
  <polyline points="1315,460 1315,497 993,497 993,345 962,345" fill="none" stroke="#e08a2e" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <polyline points="993,345 993,160 962,160" fill="none" stroke="#e08a2e" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="1020" y="490" font-size="11" fill="#9a5a14">đọc chữ ký, kiểm thu hồi (role verifier)</text>

  <!-- release -> deploy -->
  <polyline points="640,430 640,528 1398,528 1398,102 1362,102" fill="none" stroke="#2f6fd6" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="700" y="546" font-size="12" fill="#1d4ed8">release.json → fetch-release.sh → deploy.sh (triển khai bằng digest; trên kind làm thủ công)</text>

  <!-- legend -->
  <g font-size="11">
    <rect x="20" y="568" width="14" height="14" fill="#eef1f5" stroke="#7b8794" stroke-dasharray="3 2"/><text x="40" y="580">không có quyền AWS</text>
    <rect x="175" y="568" width="14" height="14" fill="#e8f0fe" stroke="#2f6fd6"/><text x="195" y="580">quyền phát hành (chỉ main, OIDC)</text>
    <rect x="405" y="568" width="14" height="14" fill="#fff7ed" stroke="#e08a2e"/><text x="425" y="580">AWS</text>
    <rect x="475" y="568" width="14" height="14" fill="#effaf3" stroke="#2e9d57"/><text x="495" y="580">cụm Kubernetes</text>
    <rect x="610" y="568" width="14" height="14" fill="#fdecea" stroke="#c62828"/><text x="630" y="580">bị chặn</text>
    <line x1="700" y1="575" x2="740" y2="575" stroke="#e08a2e" stroke-width="1.4" stroke-dasharray="5 3"/><text x="748" y="580">truy cập AWS của verifier</text>
  </g>
</svg>
